<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F1F5F7;--card:#FFFFFF;--slate:#173B4C;--mist:#536572;--line:#DCE6EC;
  --teal:#1E5A73;--tealD:#174A5F;--tealL:#DCEAF1;
  --sand:#C59A45;--sandD:#7A5A1E;--sandL:#F4EAD6;
  --rust:#A9452D;--rustL:#F6E2DC;--workL:#E3E8EC;--gold:#C9A45C;
  --serif:Fraunces,Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--slate);font-family:"DM Sans","Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:12px}
.app{max-width:520px;margin:0 auto;padding:18px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--slate);display:flex;align-items:center;justify-content:center;flex:none}
h1{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.15}
.sub{font-size:14px;color:var(--mist);margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--slate)}
.switch{background:var(--line);border-radius:999px;padding:4px;display:flex;margin-bottom:16px}
.switch button{flex:1;border:none;background:transparent;border-radius:999px;padding:11px;font-weight:700;color:var(--mist)}
.switch button.on{background:var(--card);font-weight:800}
.switch button.on.c{color:var(--tealD)}.switch button.on.p{color:var(--sandD)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 10px;color:var(--mist)}
.snap{background:var(--slate);color:#F1F5F7;border-color:var(--slate)}
.snap h2{color:var(--gold)}.snap.p h2{color:var(--gold)}
.snap p{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row+.row{border-top:1px solid #E8EEF2}
.grow{flex:1;min-width:0}
.ttl{font-weight:700;background:none;border:none;padding:0;text-align:left;width:100%;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mist);font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chk{width:28px;height:28px;border-radius:10px;border:2px solid currentColor;background:transparent;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:currentColor}
.chk.round{border-radius:50%}
.done .ttl{color:#8A9099;text-decoration:line-through}
.empty{color:var(--mist);font-size:14px;padding:4px 0 2px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--teal)}
.step{width:34px;height:34px;border-radius:50%;border:none;background:var(--paper);font-weight:800;font-size:18px}
.pill{border:none;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border-radius:18px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--mist);font-weight:700}
.stat b{font-size:18px}
.seg{background:var(--paper);border-radius:999px;padding:3px;display:inline-flex}
.seg button{border:none;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--mist)}
.seg button.on{background:var(--card);color:var(--slate)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.hrow h2{margin:0}
.link{border:none;background:none;color:var(--mist);font-weight:700;font-size:14px;padding:6px}
.decide{background:var(--sandL)}
.decide.c{background:var(--tealL)}
/* calendar */
.week{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px;display:flex;gap:2px;margin-bottom:12px}
.wd{flex:1;border:none;background:transparent;border-radius:20px;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800}
.wd small{font-size:11px;color:var(--mist);font-weight:700}
.wd.on{background:var(--slate);color:#fff}.wd.on small{color:#C9CED6}
.wd.today:not(.on){background:var(--paper)}
.dots{display:flex;gap:3px;height:12px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;font-weight:700;color:var(--mist);margin:0 4px 12px}
.legend span{display:flex;align-items:center;gap:5px}
.banner{background:var(--rustL);color:#7E3320;border-radius:20px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:8px;width:100%;border:none;text-align:left}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;gap:10px;align-items:stretch}
.tli .t{width:62px;white-space:nowrap;font-size:12px;font-weight:800;color:var(--mist);padding-top:12px;flex:none}
.blk{flex:1;border:none;border-radius:20px;padding:11px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.blk b{font-size:15px}.blk span{font-size:12px;font-weight:700;opacity:.85}
.blk.college{background:var(--tealL);color:#123848}
.blk.study{background:var(--card);color:#123848}
.blk.personal{background:var(--sandL);color:#5E4516}
.blk.work{background:var(--workL);color:var(--slate)}
.blk.break{background:transparent;border:2px dashed #C9D6DE;color:var(--mist);padding:7px 14px}
.weeknav{display:flex;align-items:center;gap:6px}
/* routine */
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:42px;height:42px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{max-width:492px;margin:0 auto;background:var(--card);border-radius:30px;padding:6px;display:flex;justify-content:space-around;pointer-events:auto;border:1px solid var(--line);box-shadow:0 6px 24px rgba(23,59,76,.08)}
.tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--mist);padding:8px 10px;border-radius:20px;min-width:64px}
.tab.on.college{background:var(--tealL);color:var(--tealD)}
.tab.on.personal{background:var(--sandL);color:var(--sandD)}
.tab.on.calendar,.tab.on.routine{background:var(--workL);color:var(--slate)}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:none;color:#fff;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(23,59,76,.18)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(23,59,76,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 14px}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.kinds button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.kinds button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:13px;font-weight:800;color:var(--mist)}
.f input,.f textarea,.f select{border:2px solid transparent;background:var(--paper);border-radius:16px;padding:12px 14px;font-size:16px;width:100%}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--teal)}
.f textarea{min-height:140px;resize:vertical}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk-line{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px}
.chk-line input{width:22px;height:22px;accent-color:var(--slate)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:none;border-radius:18px;padding:14px;font-weight:800;font-size:16px;background:var(--slate);color:#fff}
.btn.ghost{background:var(--paper);color:var(--slate)}
.btn.danger{background:var(--rustL);color:var(--rust)}
.note{font-size:13px;color:var(--mist);line-height:1.45;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--slate);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<main class="app" id="app"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var KEY="mise-data-v1";
var ICON={
 college:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/></svg>',
 personal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
 calendar:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
 routine:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>',
 gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 due:function(c){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4h6M9 11h6M9 15h4"/></svg>';},
 moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
 tick:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 logo:'<svg width="26" height="18" viewBox="0 0 26 18"><path d="M2 16V9a5 5 0 0 1 10 0v7M12 9a5 5 0 0 1 10 0v7" stroke="#F1F5F7" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="25" cy="15" r="1.6" fill="#8FB9CC"/></svg>'
};

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n;}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(s){var a=s.split("-");return new Date(+a[0],a[1]-1,+a[2]);}
function today(){return ds(new Date());}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function mondayOf(s){var d=pd(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d);}
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function longDate(s){var d=pd(s);return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+", "+d.getDate()+" "+MN[d.getMonth()];}
function shortDate(s){var d=pd(s);return d.getDate()+" "+MN[d.getMonth()].slice(0,3);}
function t12(t){if(!t)return "";var a=t.split(":"),h=+a[0];return (h%12||12)+":"+a[1]+(h<12?" am":" pm");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rupee(n){return "₹"+Math.round(n).toLocaleString("en-IN");}

/* ---------- data ---------- */
function seed(){
 var C=function(name,day,s,e,kind){return {id:uid(),name:name,day:day,start:s,end:e,kind:kind||"class"};};
 var cls=[C("MATH 151",1,"14:00","15:15"),
  C("CS 115",2,"10:00","11:15"),C("COM 101",2,"14:00","15:15"),C("CS 100",2,"15:30","16:45"),
  C("ECON 151",3,"11:30","12:45"),C("MATH 151",3,"14:00","15:15"),
  C("CS 115",4,"10:00","11:15"),C("MATH 151",4,"11:30","12:45"),C("CS 100",4,"15:30","16:45"),
  C("COM 101",5,"10:00","11:15"),C("ECON 151",5,"11:30","12:45"),C("MATH 151",5,"14:00","15:15")];
 for(var d=1;d<=5;d++)cls.push(C("Lunch",d,"12:45","13:45","break"));
 return {v:1,tasks:[],chapters:[],classes:cls,overrides:[],blocks:[],expenses:[],notes:[],
  routine:{fixed:[],variable:[],log:{}},
  settings:{buffer:3,termStart:"2026-09-01",termEnd:"2026-12-31"}};
}
var S;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}
if(!S||!S.v)S=seed();
S.attendance=S.attendance||[];if(!S.since)S.since=today();S.prep=S.prep||[];
if(!S.settings.attend)S.settings.attend=["MATH 151","ECON 151","COM 101"];
if(!S.settings.minAttend)S.settings.minAttend=75;
S.settings.morning="09:00";S.settings.wrap="23:00";S.settings.quiet=["23:30","07:00"];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(typeof scheduleSync==="function")scheduleSync();}catch(e){toast("Couldn't save. Make a backup in Settings.");}}
save();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

var UI={tab:"college",period:"week",sel:today(),week:mondayOf(today())};
try{var u=JSON.parse(localStorage.getItem(KEY+"-ui"));if(u&&u.tab)UI.tab=u.tab;}catch(e){}
function saveUI(){try{localStorage.setItem(KEY+"-ui",JSON.stringify({tab:UI.tab}));}catch(e){}}

function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function remove(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id){arr.splice(i,1);return;}}

/* ---------- queries ---------- */
function inTerm(date){return date>=S.settings.termStart&&date<=S.settings.termEnd;}
function classesOn(date){
 if(!inTerm(date))return [];
 var wd=pd(date).getDay(),out=[];
 S.classes.forEach(function(c){
  if(c.day!==wd)return;
  var ov=null;S.overrides.forEach(function(o){if(o.classId===c.id&&o.date===date)ov=o;});
  if(ov&&ov.cancel)return;
  var pr=null;S.prep.forEach(function(p){if(p.classId===c.id&&p.date===date)pr=p.text;});
  out.push({type:c.kind==="break"?"break":"college",title:c.name,start:ov?ov.start:c.start,end:ov?ov.end:c.end,classId:c.id,changed:!!ov,prep:pr||c.prep||"",track:c.kind!=="break"&&S.settings.attend.indexOf(c.name)>=0,date:date});
 });
 return out;
}
function blocksOn(date){
 var wd=pd(date).getDay();
 return S.blocks.filter(function(b){return b.date===date||(b.weekly&&pd(b.date).getDay()===wd&&date>=b.date);})
  .map(function(b){return {type:b.cat,title:b.title,start:b.start,end:b.end,blockId:b.id};});
}
function studyOn(date){
 return S.tasks.filter(function(t){return t.kind==="study"&&t.date===date&&t.start;})
  .map(function(t){return {type:"study",title:t.title,start:t.start,end:t.end,taskId:t.id,done:t.done};});
}
function timeline(date){
 return classesOn(date).concat(blocksOn(date),studyOn(date)).sort(function(a,b){return (a.start||"").localeCompare(b.start||"");});
}
function mins(t){var a=(t||"0:0").split(":");return a[0]*60+ +a[1];}
function hm(m){m=Math.max(0,m);return pad(Math.floor(m/60))+":"+pad(m%60);}
function dur(m){return m>=60?Math.floor(m/60)+" hr"+(m%60?" "+m%60+" min":""):m+" min";}
function gaps(tl){
 var it=tl.filter(function(x){return x.start&&x.type!=="free";}),out=[];if(!it.length)return out;
 var cur=mins(it[0].end||it[0].start);
 for(var i=1;i<it.length;i++){var st=mins(it[i].start);if(st-cur>=45)out.push({start:hm(cur),end:it[i].start,min:st-cur});cur=Math.max(cur,mins(it[i].end||it[i].start));}
 return out;
}
function attRec(cid,date){for(var i=0;i<S.attendance.length;i++){var r=S.attendance[i];if(r.classId===cid&&r.date===date)return r;}return null;}
function setAtt(cid,date,status){var c=find(S.classes,cid);S.attendance=S.attendance.filter(function(r){return !(r.classId===cid&&r.date===date);});if(status&&c)S.attendance.push({classId:cid,course:c.name,date:date,status:status});}
function attStats(course){var a=0,n=0;S.attendance.forEach(function(r){if(r.course===course){n++;if(r.status==="in")a++;}});return {a:a,n:n,pct:n?Math.round(a/n*100):null};}
function attPending(){
 var t=today(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),out=[];
 for(var i=2;i>=0;i--){var d=addDays(t,-i);if(d<S.since)continue;classesOn(d).forEach(function(c){if(!c.track||attRec(c.classId,d))return;if(d===t&&mins(c.end)>nm)return;out.push(c);});}

 var k=e.target.closest("[data-kind]");if(k){current.onKind(k.getAttribute("data-kind"));return;}

function need(v,msg){if(!v){toast(msg);return false;}return true;}

/* task form (all task kinds) */
var KLABEL={task:"Task",assignment:"Assignment",exam:"Exam",study:"Study session",chapter:"Chapter",expense:"Expense",note:"Note",block:"Block",fixed:"Every day",variable:"Today only"};
function taskFields(kind,t){
 t=t||{};
 if(kind==="task")return [{k:"title",label:"What needs doing?",value:t.title},{k:"date",label:"For",type:"date",value:t.date||today()}];
 if(kind==="assignment"||kind==="exam")return [{k:"title",label:kind==="exam"?"Exam":"Assignment",value:t.title,ph:kind==="exam"?"e.g. MATH 151 mid-sem":"e.g. ECON 151 problem set"},{type:"pair",items:[{k:"date",label:kind==="exam"?"Exam date":"Due date",type:"date",value:t.date||addDays(today(),7)},{k:"time",label:"Time (optional)",type:"time",value:t.time||""}]},{type:"info",text:kind==="exam"?"You'll be reminded 1 week, 3 days and 1 day before.":"You'll be reminded 7 and 3 days before, the evening before, then on the day. Add a time to also get reminders 3 hours and 1 hour before."}];
 if(kind==="study")return [{k:"title",label:"What will you study?",value:t.title,ph:"e.g. Revise MATH 151 chapter 4"},{k:"date",label:"Date",type:"date",value:t.date||today()},{type:"pair",items:[{k:"start",label:"From",type:"time",value:t.start||"17:00"},{k:"end",label:"To",type:"time",value:t.end||"18:00"}]}];
 return [];
}
function addSheet(kind){
 var side=UI.tab==="personal"?"personal":"college";
 var kinds=UI.tab==="college"?["task","assignment","exam","study","chapter"]:UI.tab==="personal"?["task","expense","note"]:UI.tab==="calendar"?["block"]:["fixed","variable"];
 kind=kind||kinds[0];
 var cfg={title:"Add",kinds:kinds.map(function(k){return [k,KLABEL[k]];}),kind:kind,onKind:function(k){addSheet(k);},saveLabel:"Add"};
 if(["task","assignment","exam","study"].indexOf(kind)>=0){
  cfg.fields=taskFields(kind);
  cfg.onSave=function(v){if(!need(v.title,"Give it a name first."))return false;var o={id:uid(),side:side,kind:kind,title:v.title,date:v.date||today(),done:false,created:Date.now()};if(kind==="study"){o.start=v.start;o.end=v.end;}if(kind==="assignment"||kind==="exam")o.time=v.time||"";S.tasks.push(o);toast("Added");};
 }else if(kind==="chapter"){
  cfg.fields=chapFields({});cfg.onSave=function(v){if(!need(v.subject&&v.name,"Add the subject and chapter."))return false;S.chapters.push({id:uid(),subject:v.subject,name:v.name,total:Math.max(1,Math.round(v.total)||1),done:0,lastMoved:today()});toast("Added");};
 }else if(kind==="expense"){
  cfg.fields=[{k:"amount",label:"Amount (₹)",type:"number",value:""},{k:"cat",label:"Category",type:"chips",value:"food",options:[["food","Food"],["travel","Travel"],["other","Other"]]},{k:"date",label:"Date",type:"date",value:today()},{k:"note",label:"Note (optional)",value:""}];
  cfg.onSave=function(v){if(!need(v.amount>0,"Enter an amount."))return false;S.expenses.push({id:uid(),amount:v.amount,cat:v.cat||"other",date:v.date||today(),note:v.note});toast(rupee(v.amount)+" added");};
 }else if(kind==="note"){
  cfg.fields=[{k:"title",label:"Title",value:""},{k:"body",label:"Note",type:"textarea",value:""}];
  cfg.onSave=function(v){if(!need(v.title||v.body,"Write something first."))return false;S.notes.push({id:uid(),title:v.title,body:v.body,updated:Date.now()});};
 }else if(kind==="block"){
  cfg.fields=blockFields({date:UI.sel});cfg.onSave=function(v){if(!need(v.title,"Give the block a name."))return false;S.blocks.push({id:uid(),title:v.title,cat:v.cat||"personal",date:v.date,start:v.start,end:v.end,weekly:v.weekly});};
 }else{
  cfg.fields=[{k:"title",label:kind==="fixed"?"Something you do every day":"Something just for today",value:""},{k:"time",label:"Time (optional)",type:"time",value:""}];
  cfg.onSave=function(v){if(!need(v.title,"Give it a name."))return false;var o={id:uid(),title:v.title,time:v.time};if(kind==="variable")o.date=today();S.routine[kind].push(o);};
 }
 openSheet(cfg);
}
function chapFields(c){return [{k:"subject",label:"Subject",value:c.subject,ph:"e.g. MATH 151"},{k:"name",label:"Chapter",value:c.name,ph:"e.g. Ch. 4 Derivatives"},{k:"total",label:"Number of sections",type:"number",value:c.total||5}];}

/* class editing */
function editClass(cid,date){
 var c=find(S.classes,cid);if(!c)return;
 var ov0=null;S.overrides.forEach(function(o){if(o.classId===cid&&o.date===date)ov0=o;});
 var scope="day";
 openSheet({title:c.name,noFocus:true,
  fields:[{k:"scope",label:"Change applies to",type:"chips",value:"day",options:[["day","Just "+shortDate(date)],["week","Every "+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][c.day]]]},
   {k:"name",label:"Name",value:c.name},
   {type:"pair",items:[{k:"start",label:"From",type:"time",value:ov0?ov0.start:c.start},{k:"end",label:"To",type:"time",value:ov0?ov0.end:c.end}]},
   {k:"prep",label:"Prep note (optional)",value:(function(){var p="";S.prep.forEach(function(x){if(x.classId===cid&&x.date===date)p=x.text;});return p||c.prep||"";})(),ph:"e.g. Bring calculator"}].concat(
   (S.settings.attend.indexOf(c.name)>=0&&date<=today())?[{k:"att",label:"Attendance",type:"chips",value:(attRec(cid,date)||{}).status||"",options:[["in","Attended"],["out","Missed"],["","Not marked"]]}]:[]),
  onChip:function(k,v){scope=v;document.getElementById("sh_del").textContent=v==="day"?"Cancel this day":"Remove from timetable";},
  delLabel:"Cancel this day",
  onSave:function(v){
   if("att" in v)setAtt(cid,date,v.att);
   S.prep=S.prep.filter(function(p){return !(p.classId===cid&&p.date===date);});
   if(v.scope==="week")c.prep=v.prep;else if(v.prep&&v.prep!==c.prep)S.prep.push({classId:cid,date:date,text:v.prep});
   if(v.scope==="week"){c.name=v.name||c.name;c.start=v.start;c.end=v.end;S.overrides=S.overrides.filter(function(o){return !(o.classId===cid&&o.date===date);});toast("Updated for every week");}
   else{S.overrides=S.overrides.filter(function(o){return !(o.classId===cid&&o.date===date);});if(v.start!==c.start||v.end!==c.end)S.overrides.push({classId:cid,date:date,start:v.start,end:v.end});toast("Changed for "+shortDate(date));}
  },
  onDelete:function(v){
   if(v.scope==="week"){if(!confirm("Remove "+c.name+" from your timetable every week?"))return false;remove(S.classes,cid);S.overrides=S.overrides.filter(function(o){return o.classId!==cid;});}
   else{S.overrides=S.overrides.filter(function(o){return !(o.classId===cid&&o.date===date);});S.overrides.push({classId:cid,date:date,cancel:true});toast("Cancelled for "+shortDate(date));}
  }});

/* ---------- reminders (used by notifications) ---------- */
function reminders(from,days){
 var out=[],last=addDays(from,days-1);
 function add(d,time,tier,title){if(d<from||d>last)return;out.push({date:d,time:time,tier:tier,title:title});}
 for(var i=0;i<days;i++){var d=addDays(from,i),tl=timeline(d);
  add(d,S.settings.morning,3,"Morning snapshot");
  add(d,S.settings.wrap,3,"Evening wrap-up");
  tl.forEach(function(x){
   if(x.type==="study"&&!x.done)add(d,hm(mins(x.start)-10),3,"Study session at "+t12(x.start)+": "+x.title);
   if(x.classId&&x.track)add(d,hm(mins(x.end)+5),2,"Did you attend "+x.title+"?");
   if(x.classId&&x.prep)add(d,hm(mins(x.start)-15),4,x.title+": "+x.prep);
  });
  gaps(tl).forEach(function(g){add(d,g.start,4,"You're free until "+t12(g.end)+" ("+dur(g.min)+")");});
  S.routine.fixed.concat(S.routine.variable.filter(function(r){return r.date===d;})).forEach(function(r){if(r.time)add(d,r.time,4,r.title);});
  S.chapters.forEach(function(c){if(c.done>=c.total)return;var n=diff(c.lastMoved||today(),d);if(n>=5&&(n-5)%3===0)add(d,"17:00",4,c.subject+", "+c.name+" hasn't moved in "+n+" days");});
 }
 S.tasks.forEach(function(t){if(t.done)return;
  if(t.kind==="assignment"){
   add(addDays(t.date,-7),"09:00",2,t.title+" is due in 7 days");
   add(addDays(t.date,-3),"09:00",2,t.title+" is due in 3 days");
   add(addDays(t.date,-1),"19:00",2,t.title+" is due tomorrow"+(t.time?" at "+t12(t.time):""));
   add(t.date,"09:00",1,t.title+" is due today"+(t.time?" at "+t12(t.time):""));
   if(t.time)[180,60].forEach(function(m){var at=mins(t.time)-m;if(at>=0)add(t.date,hm(at),1,t.title+" is due in "+(m/60)+" hour"+(m>60?"s":""));});
  }
  if(t.kind==="exam"){
   add(addDays(t.date,-7),"09:00",2,t.title+" is in 1 week");
   add(addDays(t.date,-3),"09:00",2,t.title+" is in 3 days");
   add(addDays(t.date,-1),"19:00",2,t.title+" is tomorrow"+(t.time?" at "+t12(t.time):""));
  }
 });
 var q=S.settings.quiet;
 out=out.filter(function(r){return !(r.time>=q[0]||r.time<q[1]);});
 out.sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)||a.tier-b.tier;});
 var cap={};out=out.filter(function(r){if(r.tier!==4)return true;cap[r.date]=(cap[r.date]||0)+1;return cap[r.date]<=3;});
 return out;
}
window.miseReminders=reminders;
function scheduleSheet(){
 var r=reminders(today(),3),tc={1:["var(--rustL)","var(--rust)","Critical"],2:["var(--tealL)","var(--tealD)","Important"],3:["var(--workL)","var(--slate)","Daily"],4:["var(--sandL)","var(--sandD)","Helpful"]},h="",cur="",nm=new Date().getHours()*60+new Date().getMinutes();
 r.forEach(function(x){if(x.date===today()&&mins(x.time)<nm)return;if(x.date!==cur){cur=x.date;h+='<div style="font-weight:800;color:var(--mist);margin:12px 0 2px">'+(x.date===today()?"Today":x.date===addDays(today(),1)?"Tomorrow":longDate(x.date))+'</div>';}
  h+='<div class="row"><span class="meta" style="width:62px">'+t12(x.time)+'</span><div class="grow" style="font-weight:700;font-size:15px">'+esc(x.title)+'</div><span class="chip" style="background:'+tc[x.tier][0]+';color:'+tc[x.tier][1]+'">'+tc[x.tier][2]+'</span></div>';});
 openSheet({title:"Upcoming reminders",noFocus:true,fields:[],html:'<p class="note">What Mise will notify you about over the next few days, once notifications are switched on.</p>'+(h||'<div class="empty">Nothing coming up.</div>')+'<div style="height:12px"></div>'});
}
function wrapSheet(){
 var t=today(),tom=addDays(t,1);
 var doneN=S.tasks.filter(function(x){return x.done&&x.doneOn===t;}).length+(S.routine.log[t]||[]).length;
 var roll=S.tasks.filter(function(x){return !x.done&&((x.kind==="task"&&x.date<=t)||(x.kind==="study"&&x.date===t));});
 var h='<p class="note">'+(doneN?"You finished "+plural(doneN,"thing")+" today.":"A quiet day. That's okay.")+'</p>';
 h+='<div style="font-weight:800;color:var(--mist);margin:4px 0 2px">Carrying over to tomorrow</div>';
 h+=roll.length?roll.map(function(x){return '<div class="row"><span class="dot" style="background:'+(x.side==="college"?"var(--teal)":"var(--sand)")+'"></span><div class="grow" style="font-weight:700">'+esc(x.title)+'</div><button class="pill" style="background:var(--paper)" data-x="wdone" data-id="'+x.id+'">Done</button><button class="pill" style="background:var(--rustL);color:var(--rust)" data-x="wdel" data-id="'+x.id+'">Delete</button></div>';}).join(""):'<div class="empty">Nothing. Everything from today is done.</div>';
 h+='<div style="font-weight:800;color:var(--mist);margin:16px 0 2px">'+longDate(tom)+'</div>';
 var tl=timeline(tom).filter(function(x){return x.type!=="break";});
 h+=tl.length?tl.map(function(x){var col=x.type==="personal"?"var(--sand)":x.type==="work"?"var(--mist)":"var(--teal)";return '<div class="row"><span class="dot" style="background:'+col+'"></span><div class="grow" style="font-weight:700">'+esc(x.title)+(x.prep?'<div class="meta" style="white-space:normal">'+esc(x.prep)+'</div>':"")+'</div><span class="meta">'+t12(x.start)+'</span></div>';}).join(""):'<div class="empty">Nothing scheduled.</div>';
 var soon=S.tasks.filter(function(x){return !x.done&&((x.kind==="assignment"&&x.date<=addDays(tom,1))||(x.kind==="exam"&&x.date<=addDays(t,3)));}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(soon.length){h+='<div style="font-weight:800;color:var(--mist);margin:16px 0 2px">Coming up</div>'+soon.map(function(x){var n=diff(t,x.date);return '<div class="row">'+ICON.due(n<=1?"#A9452D":"#174A5F")+'<div class="grow" style="font-weight:700">'+esc(x.title)+'</div><span class="meta">'+(n<0?"Overdue":n===0?"Today":n===1?"Tomorrow":"In "+n+" days")+(x.time?", "+t12(x.time):"")+'</span></div>';}).join("");}
 openSheet({title:"Evening wrap-up",noFocus:true,fields:[],html:h+'<div style="height:14px"></div>',
  onExtra:function(a,id){var x=find(S.tasks,id);if(!x)return;if(a==="wdone"){x.done=true;x.doneOn=t;}if(a==="wdel"){if(!confirm("Delete \u201C"+x.title+"\u201D?"))return;remove(S.tasks,id);}save();render();wrapSheet();}});
}
function gapSheet(st,en){
 openSheet({title:"Plan this free time",fields:taskFields("study",{date:UI.sel,start:st,end:en}),saveLabel:"Add",
  onSave:function(v){if(!need(v.title,"What will you study?"))return false;S.tasks.push({id:uid(),side:"college",kind:"study",title:v.title,date:v.date,start:v.start,end:v.end,done:false,created:Date.now()});toast("Study session added");}});
}

/* ---------- actions ---------- */
document.getElementById("fab").addEventListener("click",function(){addSheet();});
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b||sheet.contains(b))return;
 var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),v=b.getAttribute("data-v"),t;
 if(a==="tab"){UI.tab=v;saveUI();window.scrollTo(0,0);}
 else if(a==="toggle"){t=find(S.tasks,id);if(t){t.done=!t.done;t.doneOn=t.done?today():null;save();}}
 else if(a==="edit-task")return editTask(id);
 else if(a==="keep"){t=find(S.tasks,id);t.date=today();save();toast("Kept for today");}
 else if(a==="del-task"){t=find(S.tasks,id);if(t&&confirm("Delete \u201C"+t.title+"\u201D?")){remove(S.tasks,id);save();}}
 else if(a==="chap"){t=find(S.chapters,id);var nd=Math.min(t.total,Math.max(0,t.done+ +v));if(nd!==t.done){t.done=nd;t.lastMoved=today();}save();}
 else if(a==="edit-chap"){t=find(S.chapters,id);return openSheet({title:"Edit chapter",fields:chapFields(t),noFocus:true,onSave:function(x){t.subject=x.subject;t.name=x.name;t.total=Math.max(1,Math.round(x.total)||1);t.done=Math.min(t.done,t.total);},onDelete:function(){if(!confirm("Delete this chapter?"))return false;remove(S.chapters,id);}});}
 else if(a==="period")UI.period=v;
 else if(a==="expenses")return expensesSheet();
 else if(a==="note")return noteSheet(id);
 else if(a==="wk"){UI.week=addDays(UI.week,+v);UI.sel=UI.week;}
 else if(a==="day"){UI.sel=v;UI.week=mondayOf(v);}
 else if(a==="cls")return editClass(id,UI.sel);
 else if(a==="blk")return editBlock(id);
 else if(a==="rt"){var L=S.routine.log[today()]=S.routine.log[today()]||[],i=L.indexOf(id);if(i>=0)L.splice(i,1);else L.push(id);
  var keep={};Object.keys(S.routine.log).forEach(function(k){if(diff(k,today())<=30)keep[k]=S.routine.log[k];});S.routine.log=keep;save();}
 else if(a==="rt-edit")return routineEdit(id);
 else if(a==="settings")return settingsSheet();
 else if(a==="wrap")return wrapSheet();
 else if(a==="gap"){var g=v.split("|");return gapSheet(g[0],g[1]);}
 else if(a==="att"){setAtt(id,b.getAttribute("data-d"),v);save();var lw=lowAtt();if(lw.length)toast(lw[0]+" is below "+S.settings.minAttend+"%");}
 render();
});

var tt;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("show");},2200);}

/* refresh when the day changes or the app comes back */
var lastDay=today();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&today()!==lastDay){lastDay=today();UI.sel=lastDay;UI.week=mondayOf(lastDay);render();}});
setInterval(function(){if(today()!==lastDay){lastDay=today();UI.sel=lastDay;UI.week=mondayOf(lastDay);render();}},60000);

/* tidy: drop old today-only routine items */
S.routine.variable=S.routine.variable.filter(function(x){return diff(x.date,today())<=7;});save();

if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host)){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
try{localStorage.removeItem(KEY+"-lock");}catch(e){}
/* ---------- notifications ---------- */
var NK=KEY+"-push";
function pushCfg(){try{return JSON.parse(localStorage.getItem(NK))||{};}catch(e){return {};}}
function setPushCfg(o){try{localStorage.setItem(NK,JSON.stringify(o));}catch(e){}}
function callFn(body){var c=pushCfg();body.secret=c.secret;
 return fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(r.status===401?"The secret doesn't match the one in Supabase.":(j.error||"Server error "+r.status));return j;});});}
function b64u(s){var p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function snapFor(d){
 var cls=classesOn(d).filter(function(c){return c.type!=="break";}).length;
 var due=S.tasks.filter(function(t){return !t.done&&(t.kind==="assignment"||t.kind==="exam")&&diff(d,t.date)>=0&&diff(d,t.date)<=1;}).length;
 var todo=S.tasks.filter(function(t){return t.kind==="task"&&!t.done&&t.date<=d;}).length;
 return (cls?plural(cls,"class"):"No classes")+", "+(due?plural(due,"deadline")+" by tomorrow":"no urgent deadlines")+", "+plural(todo,"task")+" on your list.";
}
function syncNow(){
 var c=pushCfg();if(!c.on||!c.url)return;var now=Date.now();
 var list=reminders(today(),7).map(function(r){
  var a=r.date.split("-"),t=r.time.split(":"),at=new Date(+a[0],a[1]-1,+a[2],+t[0],+t[1]),body=r.title,url="./";
  if(r.title==="Morning snapshot")body="Good morning. "+snapFor(r.date);
  if(r.title==="Evening wrap-up"){body="Time to wrap up: see what carries over and what's on tomorrow.";url="./?open=wrap";}
  return {fire_at:at.toISOString(),t:at.getTime(),title:["","Due soon","Coming up","Mise","Mise"][r.tier],body:body,tier:r.tier,url:url};
 }).filter(function(r){return r.t>now;});
 list.forEach(function(r){delete r.t;});
 callFn({action:"sync",reminders:list}).catch(function(){});
}
var syncT;function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(syncNow,2500);}
function turnOnPush(url,secret){
 if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){toast("Open Mise from its home screen icon to turn on notifications.");return;}
 setPushCfg({url:url,secret:secret,on:false});
 Promise.resolve(Notification.requestPermission()).then(function(p){if(p!=="granted")throw new Error("Notifications weren't allowed. Check iPhone Settings, Notifications, Mise.");return callFn({action:"vapid"});})
 .then(function(j){return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(j.publicKey)});});});})
 .then(function(sub){return callFn({action:"subscribe",subscription:sub.toJSON()});})
 .then(function(){setPushCfg({url:url,secret:secret,on:true});syncNow();toast("Notifications are on");closeSheet();})
 .catch(function(e){toast(e.message||"Something went wrong");});
}
function notifSheet(){
 var c=pushCfg();
 openSheet({title:"Notifications",noFocus:true,
  html:c.on?'<div class="actions" style="margin-bottom:14px"><button class="btn ghost" data-x="ptest">Send a test</button><button class="btn ghost" data-x="poff">Turn off</button></div>':"",
  fields:[{type:"info",text:c.on?"Notifications are on. Reminders update automatically whenever you change something in Mise.":"Paste the two values from your Supabase setup, then tap Turn on."},
   {k:"url",label:"Function URL",value:c.url||"",ph:"https://xxxx.supabase.co/functions/v1/mise"},
   {k:"secret",label:"Secret",type:"password",value:c.secret||""}],
  saveLabel:c.on?"Save":"Turn on",
  onSave:function(v){if(!need(v.url&&v.secret,"Fill in both fields."))return false;turnOnPush(v.url.trim(),v.secret.trim());return false;},
  onExtra:function(x){
   if(x==="ptest")callFn({action:"test"}).then(function(){toast("Test sent. It should arrive in a few seconds.");},function(e){toast(e.message);});
   if(x==="poff"){var cc=pushCfg();callFn({action:"sync",reminders:[]}).catch(function(){});cc.on=false;setPushCfg(cc);toast("Notifications are off");closeSheet();}
  }});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow();});
setTimeout(syncNow,1500);
render();
if(/[?&]open=wrap/.test(location.search))wrapSheet();
})();
</script>
